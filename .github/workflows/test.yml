name: test
# gkkobservatory build: tests only. This repository publishes nothing to npm, the MCP registry or GitHub releases.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci
      - run: npm test

  gate:                      # the one context Phase 6 requires
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: All matrix legs must pass
        run: test "${{ needs.test.result }}" = "success"

